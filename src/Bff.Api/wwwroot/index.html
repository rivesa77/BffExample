<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejemplo BFF · Productos</title>
  <style>
    body { margin: 0; background: #f4f6fa; color: #17243b; font: 17px/1.6 system-ui, sans-serif; }
    main { max-width: 640px; margin: 8vh auto; padding: 28px; }
    h1 { line-height: 1.2; }
    article { background: white; padding: 28px; border-radius: 16px; box-shadow: 0 8px 30px #17243b0d; margin-top: 24px; }
    select, button { padding: 10px 14px; border-radius: 8px; font: inherit; }
    select { border: 1px solid #9aa9bd; }
    button { background: #1d4ed8; color: white; border: 0; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #price { font-size: 28px; font-weight: 700; }
    #status { min-height: 1.6em; }
  </style>
</head>
<body>
<main>
  <h1>Productos</h1>
  <p>Selecciona un producto para consultar su precio y disponibilidad.</p>
  <form id="form">
    <label for="product">Producto</label>
    <select id="product">
      <option value="1">Portátil</option>
      <option value="2">Teclado (agotado)</option>
      <option value="999">Producto inexistente</option>
    </select>
    <button id="load" type="submit">Consultar</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <article id="card" hidden>
    <h2 id="name"></h2>
    <p id="description"></p>
    <p id="price"></p>
    <p id="availability"></p>
  </article>
</main>
<script>
  const form = document.querySelector('#form');
  const status = document.querySelector('#status');
  const card = document.querySelector('#card');
  const button = document.querySelector('#load');
  async function loadProduct(event) {
    event?.preventDefault();
    button.disabled = true;
    card.hidden = true;
    status.textContent = 'Consultando…';
    try {
      // El navegador solo conoce el BFF. Catálogo e inventario quedan detrás.
      const response = await fetch(`/bff/products/${document.querySelector('#product').value}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.title || 'No se pudo consultar el producto.');
      document.querySelector('#name').textContent = data.name;
      document.querySelector('#description').textContent = data.description;
      document.querySelector('#price').textContent = data.displayPrice;
      document.querySelector('#availability').textContent = data.availability;
      card.hidden = false;
      status.textContent = '';
    } catch (error) {
      status.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  }
  form.addEventListener('submit', loadProduct);
  loadProduct();
</script>
</body>
</html>
